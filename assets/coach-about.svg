<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" fill="none">
  <defs>
    <linearGradient id="skin2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c090"/>
      <stop offset="100%" stop-color="#c4956e"/>
    </linearGradient>
    <radialGradient id="g" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#B9FF66" stop-opacity=".03"/>
      <stop offset="100%" stop-color="#B9FF66" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="600" fill="#000"/>
  <rect width="500" height="600" fill="url(#g)"/>

  <!-- Shoulders -->
  <path d="M120 300 l-30 60 q-10 40-6 70 l4 20 q4 12 14 8 l26-10 q20-8 24-30 l8-60 q4-30-4-58z" fill="#111"/>
  <path d="M380 300 l30 60 q10 40 6 70l-4 20q-4 12-14 8l-26-10q-20-8-24-30l-8-60q-4-30 4-58z" fill="#111"/>
  <!-- Shoulder definition -->
  <path d="M130 310 Q150 290 170 300" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M370 310 Q350 290 330 300" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <!-- Arms crossed -->
  <path d="M130 310 q-20 40-10 80 l8 20 q6 10 16 6 l14-10 q12-12 8-40l-6-56z" fill="#1a1a1a"/>
  <path d="M370 310 q20 40 10 80l-8 20q-6 10-16 6l-14-10q-12-12-8-40l6-56z" fill="#1a1a1a"/>
  <!-- Forearms crossing -->
  <path d="M156 420 q-8 30 4 50 l6 10 q6 6 12 0 l8-12 q8-16 0-40l-12-28z" fill="url(#skin2)"/>
  <path d="M344 420 q8 30-4 50l-6 10q-6 6-12 0l-8-12q-8-16 0-40l12-28z" fill="url(#skin2)"/>

  <!-- Neck -->
  <rect x="230" y="228" width="40" height="50" rx="10" fill="url(#skin2)"/>

  <!-- Head -->
  <ellipse cx="250" cy="180" rx="48" ry="56" fill="url(#skin2)"/>

  <!-- Hair -->
  <ellipse cx="250" cy="142" rx="50" ry="38" fill="#0a0a0a"/>
  <ellipse cx="250" cy="152" rx="44" ry="28" fill="#111"/>

  <!-- Face features -->
  <ellipse cx="232" cy="178" rx="3" ry="3.5" fill="#1a1a1a" opacity=".4"/>
  <ellipse cx="268" cy="178" rx="3" ry="3.5" fill="#1a1a1a" opacity=".4"/>
  <ellipse cx="250" cy="198" rx="14" ry="8" fill="#1a1a1a" opacity=".15"/>
  <path d="M238 200 Q250 208 262 200" stroke="#1a1a1a" stroke-width="1.5" fill="none" opacity=".3"/>

  <!-- Torso -->
  <path d="M185 260 l-20 40 q-12 40-8 70 l25-10 q20-6 24-28 l8-60 q4-36-4-60z" fill="#111"/>
  <path d="M315 260 l20 40 q12 40 8 70l-25-10q-20-6-24-28l-8-60q-4-36 4-60z" fill="#111"/>

  <!-- Chest definition -->
  <path d="M210 280 Q250 310 290 280" stroke="#1a1a1a" stroke-width="2" fill="none" opacity=".5"/>

  <!-- Accent frame -->
  <rect x="20" y="20" width="460" height="560" rx="16" stroke="#B9FF66" stroke-opacity=".06" stroke-width="1" fill="none"/>
  <rect x="28" y="28" width="444" height="544" rx="14" stroke="#B9FF66" stroke-opacity=".03" stroke-width=".5" fill="none"/>

  <!-- Neon accent line -->
  <line x1="40" y1="520" x2="460" y2="520" stroke="#B9FF66" stroke-opacity=".08" stroke-width="1"/>

  <text x="250" y="555" text-anchor="middle" fill="#B9FF66" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="4" opacity=".4">STRONGER COACHING</text>
</svg>
